<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16A34A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="30 Dias">
<meta name="mobile-web-app-capable" content="yes">
<title>Plano 30 Dias</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2316A34A'/><text x='50' y='68' font-size='52' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>30</text></svg>">
<style>
  :root{
    --ink:#101614; --paper:#F4F6F4; --card:#FFF; --line:#DDE3DE;
    --muted:#6E7A72; --green:#16A34A; --green-dark:#14532D; --green-soft:#E7F5EC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;
  }
  #root{max-width:520px;margin:0 auto;padding:16px 14px calc(40px + env(safe-area-inset-bottom))}
  .boot{padding:70px 0;text-align:center;color:var(--muted)}

  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .daynum{font-size:46px;font-weight:700;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .daynum span{font-size:17px;font-weight:500;color:var(--muted);letter-spacing:0}
  .datecol{text-align:right}
  .datestr{font-size:13px;color:var(--muted);text-transform:capitalize}
  .streak{font-size:13px;font-weight:600;color:var(--green-dark);margin-top:2px}

  .nav{display:flex;gap:8px;margin:14px 0 16px}
  .nav button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);
    border-radius:9px;font-size:13px;color:var(--ink);font-family:inherit}
  .nav button:disabled{opacity:.35}
  .nav button.today{flex:0 0 auto;padding:10px 18px;font-weight:600}

  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
  .bar i{display:block;height:100%;background:var(--green);transition:width .3s ease}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{font-size:12px;font-weight:700;margin:0 0 10px;color:var(--muted)}

  .item{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line);user-select:none}
  .item:last-child{border-bottom:none}
  .box{width:24px;height:24px;flex:0 0 24px;border-radius:7px;border:2px solid var(--line);
    display:grid;place-items:center;transition:all .15s ease}
  .item.on .box{background:var(--green);border-color:var(--green)}
  .box svg{width:14px;height:14px;opacity:0}
  .item.on .box svg{opacity:1}
  .label{font-size:15px;line-height:1.3}
  .item.on .label{color:var(--muted);text-decoration:line-through}
  .sub{font-size:12.5px;color:var(--muted);margin-top:2px}

  .wk-title{font-size:17px;font-weight:700;line-height:1.25}
  .wk-meta{font-size:13px;color:var(--muted);margin-top:3px}
  .wk-toggle{margin-top:11px;width:100%;padding:10px;font-size:13px;font-family:inherit;
    background:var(--green-soft);color:var(--green-dark);border:none;border-radius:9px;font-weight:600}
  .ex{margin-top:11px;border-top:1px solid var(--line)}
  .exrow{padding:9px 0;border-bottom:1px solid var(--line)}
  .exrow:last-child{border-bottom:none}
  .extop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .exname{font-size:14px;line-height:1.3}
  .exsets{font-weight:600;color:var(--green-dark);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13.5px}
  .exload{display:flex;align-items:center;gap:8px;margin-top:7px}
  .exload input{width:78px;padding:7px 9px;font-size:16px;font-family:inherit;border:1px solid var(--line);
    border-radius:8px;background:var(--paper);color:var(--ink)}
  .exlast{font-size:12px;color:var(--muted)}
  .exlast b{color:var(--green-dark)}

  .water{display:flex;gap:7px}
  .glass{flex:1;height:48px;border:2px solid var(--line);border-radius:7px;background:var(--card);
    transition:all .15s ease;display:grid;place-items:end center;padding-bottom:4px;font-size:10px;color:var(--muted)}
  .glass.on{background:var(--green);border-color:var(--green);color:#fff}
  .wlabel{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .wamt{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}

  .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
  .cell{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;
    font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--card)}
  .cell.part{background:var(--green-soft);border-color:#BFE3CC;color:var(--green-dark)}
  .cell.full{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
  .cell.now{outline:2px solid var(--ink);outline-offset:1px}
  .cell.future{opacity:.4}

  .fields{display:flex;gap:9px}
  .fields label{flex:1;font-size:12px;color:var(--muted)}
  .fields input{width:100%;margin-top:5px;padding:11px;font-size:16px;font-family:inherit;
    border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink)}
  .hist{margin-top:12px;font-size:13px}
  .hist div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
  .hist div:last-child{border-bottom:none}
  .hist b{font-variant-numeric:tabular-nums;font-weight:600}
  .delta{color:var(--green-dark);font-size:12px}

  textarea{width:100%;min-height:64px;padding:11px;font-size:15px;font-family:inherit;resize:vertical;
    border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink)}

  .note{font-size:12.5px;color:var(--muted);line-height:1.5;padding:12px 14px;
    background:var(--green-soft);border-radius:12px;border-left:3px solid var(--green);margin-bottom:12px}

  .tools{display:flex;gap:8px}
  .tools button{flex:1;padding:11px;font-size:13px;font-family:inherit;background:var(--card);
    border:1px solid var(--line);border-radius:9px;color:var(--ink)}

  .setup{padding:40px 8px;text-align:center}
  .setup h1{font-size:26px;margin:0 0 10px;letter-spacing:-.02em}
  .setup p{color:var(--muted);font-size:14.5px;line-height:1.55;margin:0 auto 24px;max-width:340px}
  .btn{padding:15px 28px;background:var(--green);color:#fff;border:none;border-radius:11px;
    font-size:15.5px;font-weight:600;font-family:inherit}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);
    color:#fff;padding:11px 18px;border-radius:9px;font-size:13px;z-index:50;max-width:90%;text-align:center}
  button{cursor:pointer}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"><div class="boot">Carregando seu plano…</div></div>

<script>
(function(){
  const KEY='plano30:v2';
  const root=document.getElementById('root');
  let state={start:null,days:{},logs:{},loads:{}};
  let view=null, showEx=false;

  const TASKS=[
    {id:'treino',label:'Treino do dia',sub:'academia ou corrida, conforme o dia'},
    {id:'caminhada',label:'Caminhada 40 min',sub:'fora do treino, pode fracionar'},
    {id:'creatina',label:'Creatina 5 g',sub:'todo dia, sem exceção'},
    {id:'sono',label:'Dormi 8 horas',sub:'requisito, não meta'}
  ];
  const MEALS=[
    {id:'cafe',label:'Café da manhã',sub:'~350 kcal · 40 g proteína'},
    {id:'almoco',label:'Almoço',sub:'~500 kcal · 55 g proteína'},
    {id:'lanche',label:'Lanche',sub:'~250 kcal · 35 g proteína'},
    {id:'jantar',label:'Jantar',sub:'~450 kcal · 45 g proteína'},
    {id:'ceia',label:'Ceia',sub:'~150 kcal · 25 g proteína'}
  ];
  const WORKOUTS={
    1:{name:'Superiores A — empurrar',cardio:'20 min esteira, inclinação 10%',load:true,ex:[
      ['Supino reto com halteres','4×8-10'],['Supino inclinado','3×10-12'],
      ['Desenvolvimento com halteres','3×10-12'],['Elevação lateral','3×12-15'],
      ['Tríceps na corda','3×12'],['Tríceps testa','3×12']]},
    2:{name:'Inferiores A — quadríceps',cardio:'15 min bicicleta',load:true,ex:[
      ['Agachamento livre ou Smith','4×8-10'],['Leg press','3×12'],
      ['Cadeira extensora','3×12-15'],['Mesa flexora','3×12'],['Panturrilha em pé','4×15-20']]},
    3:{name:'Corrida intervalada + core',cardio:'5 min aquece · tiros · 5 min desaquece',load:false,ex:[
      ['Tiros — sem. 1 / 2 / 3 / 4','6× / 7× / 8× / 8×'],['Prancha','3×45s'],
      ['Abdominal infra','3×15'],['Prancha lateral','2×30s']]},
    4:{name:'Superiores B — puxar',cardio:'20 min bike ou esteira',load:true,ex:[
      ['Puxada frontal','4×10'],['Remada baixa','4×10'],
      ['Remada curvada com halteres','3×10-12'],['Crucifixo inverso','3×15'],
      ['Rosca direta','3×10-12'],['Rosca martelo','3×12']]},
    5:{name:'Inferiores B — posterior e glúteo',cardio:'15 min esteira inclinada',load:true,ex:[
      ['Levantamento terra romeno','4×10'],['Afundo / passada','3×12 cada'],
      ['Cadeira flexora','3×12'],['Elevação pélvica','3×12'],['Abdução de quadril','3×15']]},
    6:{name:'Ombro e braço',cardio:'25 min esteira, inclinação 8-10%',load:true,ex:[
      ['Desenvolvimento máquina','4×10'],['Elevação lateral','4×12-15'],
      ['Elevação frontal','3×12'],['Crucifixo inverso','3×15'],
      ['Rosca alternada','3×12'],['Tríceps francês','3×12']]},
    0:{name:'Corrida contínua',cardio:'25 a 35 min conforme a semana',load:false,ex:[
      ['Corrida — sem. 1 / 2 / 3 / 4','25 / 30 / 30 / 35 min'],['Alongamento','10 min']]}
  };

  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
  const today=()=>iso(new Date());
  const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
  const dayIndex=s=>Math.round((parse(s)-parse(state.start))/86400000)+1;
  const pretty=s=>parse(s).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'short'});
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function load(){
    try{const raw=localStorage.getItem(KEY);if(raw)state=Object.assign(state,JSON.parse(raw));}
    catch(e){toast('Não deu para ler os dados salvos.');}
  }
  let t=null;
  function save(){
    clearTimeout(t);
    t=setTimeout(()=>{
      try{localStorage.setItem(KEY,JSON.stringify(state));}
      catch(e){toast('Não deu para salvar. Verifique o espaço do navegador.');}
    },200);
  }
  function toast(m){
    const el=document.createElement('div');el.className='toast';el.textContent=m;
    document.body.appendChild(el);setTimeout(()=>el.remove(),2800);
  }

  function day(d){if(!state.days[d])state.days[d]={done:{},water:0,nota:''};
    if(state.days[d].nota===undefined)state.days[d].nota='';return state.days[d];}
  const TOTAL=TASKS.length+MEALS.length+1;
  function score(d){const x=state.days[d];if(!x)return 0;
    return (Object.values(x.done).filter(Boolean).length+(x.water>=8?1:0))/TOTAL;}
  function streak(){let n=0,d=today();if(score(d)<1)d=addDays(d,-1);
    while(score(d)>=1){n++;d=addDays(d,-1);}return n;}
  function lastLoad(name,before){
    const h=state.loads[name];if(!h)return null;
    const prev=Object.keys(h).filter(k=>k<before).sort();
    return prev.length?{kg:h[prev[prev.length-1]],date:prev[prev.length-1]}:null;
  }

  function render(){
    if(!state.start)return renderSetup();
    const idx=dayIndex(view), wk=WORKOUTS[parse(view).getDay()], d=day(view);
    const pct=Math.round(score(view)*100), st=streak(), isToday=view===today();

    root.innerHTML=`
      <div class="head">
        <div class="daynum">${idx>0&&idx<=30?idx:'–'}<span> / 30</span></div>
        <div class="datecol">
          <div class="datestr">${pretty(view)}</div>
          ${st>0?`<div class="streak">${st} ${st===1?'dia seguido':'dias seguidos'}</div>`:''}
        </div>
      </div>

      <div class="nav">
        <button data-go="-1">← Ontem</button>
        <button class="today" data-go="0" ${isToday?'disabled':''}>Hoje</button>
        <button data-go="1" ${isToday?'disabled':''}>Amanhã →</button>
      </div>

      <div class="bar"><i style="width:${pct}%"></i></div>

      <div class="card">
        <div class="wk-title">${wk.name}</div>
        <div class="wk-meta">Cardio: ${wk.cardio}</div>
        <button class="wk-toggle" data-ex>${showEx?'Esconder exercícios':'Ver exercícios e anotar carga'}</button>
        ${showEx?`<div class="ex">${wk.ex.map(e=>exRow(e,wk.load)).join('')}</div>`:''}
      </div>

      <div class="card"><h2>Execução do dia</h2>${TASKS.map(x=>item(x,d)).join('')}</div>
      <div class="card"><h2>Refeições · 1.700 kcal · 200 g de proteína</h2>${MEALS.map(x=>item(x,d)).join('')}</div>

      <div class="card">
        <div class="wlabel"><h2 style="margin:0">Água</h2>
          <div class="wamt">${(d.water*0.5).toFixed(1).replace('.',',')} L <span style="color:var(--muted);font-weight:400">/ 4 L</span></div>
        </div>
        <div class="water">${Array.from({length:8},(_,i)=>
          `<button class="glass ${i<d.water?'on':''}" data-water="${i+1}">500</button>`).join('')}</div>
      </div>

      <div class="card">
        <h2>Medidas da semana</h2>
        <div class="fields">
          <label>Peso (kg)<input type="number" step="0.1" inputmode="decimal" data-log="peso"
            value="${state.logs[view]&&state.logs[view].peso!=null?state.logs[view].peso:''}" placeholder="93,0"></label>
          <label>Cintura (cm)<input type="number" step="0.5" inputmode="decimal" data-log="cintura"
            value="${state.logs[view]&&state.logs[view].cintura!=null?state.logs[view].cintura:''}" placeholder="104"></label>
        </div>
        ${history()}
      </div>

      <div class="card"><h2>Como foi o dia</h2>
        <textarea data-nota placeholder="Energia, fome, sono, carga que travou…">${esc(d.nota)}</textarea>
      </div>

      <div class="card"><h2>Os 30 dias</h2>
        <div class="grid">${Array.from({length:30},(_,i)=>{
          const dt=addDays(state.start,i), s=score(dt);
          const cls=s>=1?'full':s>0?'part':(dt>today()?'future':'');
          return `<button class="cell ${cls} ${dt===view?'now':''}" data-day="${dt}">${i+1}</button>`;
        }).join('')}</div>
      </div>

      <div class="note">
        Se dois destes durarem mais de 3 dias — carga caindo, tontura, sono quebrando, irritação,
        fome que não passa — suba para 2.000 kcal. É leitura de instrumento, não desistência.
        Se um dia furar, retome no seguinte: sem jejum e sem treino dobrado para compensar.
      </div>

      <div class="tools">
        <button data-export>Salvar backup</button>
        <button data-import>Restaurar backup</button>
      </div>`;
    wire();
  }

  function exRow(e,hasLoad){
    const [name,sets]=e;
    const cur=(state.loads[name]&&state.loads[name][view])!=null?state.loads[name][view]:'';
    const prev=lastLoad(name,view);
    return `<div class="exrow">
      <div class="extop"><div class="exname">${esc(name)}</div><div class="exsets">${sets}</div></div>
      ${hasLoad?`<div class="exload">
        <input type="number" step="0.5" inputmode="decimal" placeholder="kg"
          data-loadex="${esc(name)}" value="${cur}">
        <div class="exlast">${prev?`última: <b>${prev.kg} kg</b> · dia ${dayIndex(prev.date)}`:'primeira vez'}</div>
      </div>`:''}
    </div>`;
  }

  function item(x,d){
    const on=!!d.done[x.id];
    return `<div class="item ${on?'on':''}" data-task="${x.id}">
      <div class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div><div class="label">${x.label}</div><div class="sub">${x.sub}</div></div></div>`;
  }

  function history(){
    const keys=Object.keys(state.logs).filter(k=>state.logs[k].peso!=null).sort();
    if(!keys.length)return '';
    const first=state.logs[keys[0]].peso;
    return `<div class="hist">${keys.slice(-6).map(k=>{
      const p=state.logs[k].peso, dif=p-first, c=state.logs[k].cintura;
      return `<div><span>Dia ${dayIndex(k)}</span><span><b>${p} kg</b>${c?' · '+c+' cm':''}${
        keys[0]!==k?` <span class="delta">${dif>0?'+':''}${dif.toFixed(1)}</span>`:''}</span></div>`;
    }).join('')}</div>`;
  }

  function renderSetup(){
    root.innerHTML=`<div class="setup">
      <h1>Plano de 30 dias</h1>
      <p>1.700 kcal, 200 g de proteína, seis dias de academia e 40 minutos de caminhada por dia.
      Marque o que você cumpriu — fica tudo salvo neste aparelho e continua de onde você parou.</p>
      <button class="btn" data-start>Começar hoje</button></div>`;
    root.querySelector('[data-start]').onclick=()=>{state.start=today();view=today();save();render();};
  }

  function wire(){
    root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
      const n=+b.dataset.go; view=n===0?today():addDays(view,n); showEx=false; render();});
    root.querySelector('[data-ex]').onclick=()=>{showEx=!showEx;render();};
    root.querySelectorAll('[data-task]').forEach(el=>el.onclick=()=>{
      const d=day(view),id=el.dataset.task; d.done[id]=!d.done[id]; save(); render();});
    root.querySelectorAll('[data-water]').forEach(el=>el.onclick=()=>{
      const d=day(view),n=+el.dataset.water; d.water=(d.water===n)?n-1:n; save(); render();});
    root.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{
      view=el.dataset.day; showEx=false; render();});
    root.querySelectorAll('[data-log]').forEach(el=>el.onchange=()=>{
      if(!state.logs[view])state.logs[view]={};
      state.logs[view][el.dataset.log]=el.value===''?null:parseFloat(el.value);
      save(); render();});
    root.querySelectorAll('[data-loadex]').forEach(el=>el.onchange=()=>{
      const n=el.dataset.loadex;
      if(!state.loads[n])state.loads[n]={};
      if(el.value==='')delete state.loads[n][view];
      else state.loads[n][view]=parseFloat(el.value);
      save(); render();});
    const nota=root.querySelector('[data-nota]');
    if(nota)nota.oninput=()=>{day(view).nota=nota.value;save();};
    root.querySelector('[data-export]').onclick=exportar;
    root.querySelector('[data-import]').onclick=importar;
  }

  function exportar(){
    const txt=JSON.stringify(state);
    const blob=new Blob([txt],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='plano30-backup-'+today()+'.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast('Backup salvo nos seus downloads.');
  }
  function importar(){
    const inp=document.createElement('input');
    inp.type='file'; inp.accept='application/json,.json';
    inp.onchange=()=>{
      const f=inp.files[0]; if(!f)return;
      const r=new FileReader();
      r.onload=()=>{
        try{
          const obj=JSON.parse(r.result);
          if(!obj.start)throw new Error('formato');
          state=Object.assign({start:null,days:{},logs:{},loads:{}},obj);
          save(); view=today(); render(); toast('Backup restaurado.');
        }catch(e){toast('Arquivo inválido. Escolha um backup deste app.');}
      };
      r.readAsText(f);
    };
    inp.click();
  }

  load(); view=today(); render();
})();
</script>
</body>
</html>
