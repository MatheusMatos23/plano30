<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1311">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="30 Dias">
<meta name="mobile-web-app-capable" content="yes">
<title>Plano 30 Dias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230E1311'/><text x='50' y='70' font-size='54' font-family='Georgia,serif' fill='%235FB98A' text-anchor='middle'>30</text></svg>">
<style>
  :root{
    --bg:#0E1311; --surface:#161D1A; --raised:#1E2723; --line:#27312D;
    --text:#EDEBE4; --muted:#8A948E; --dim:#5E6A64;
    --jade:#5FB98A; --jade-dim:#2E5B45; --danger:#C97A6D;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg)}
  body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;
  }
  #root{max-width:520px;margin:0 auto;
    padding:calc(20px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom))}
  .boot{padding:90px 0;text-align:center;color:var(--dim);font-size:14px}
  button{cursor:pointer;font-family:inherit;color:inherit}

  /* ---------- hero ---------- */
  .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
  .dayblock{display:flex;align-items:baseline;gap:8px}
  .daynum{font-family:"Instrument Serif",Georgia,serif;font-size:72px;line-height:.78;
    letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .dayof{font-size:14px;color:var(--dim);letter-spacing:.02em}
  .heroright{text-align:right;padding-bottom:4px}
  .datestr{font-size:13px;color:var(--muted);text-transform:capitalize;letter-spacing:.01em}
  .streak{margin-top:6px;display:inline-flex;align-items:center;gap:6px;font-size:12px;
    color:var(--jade);border:1px solid var(--jade-dim);border-radius:999px;padding:4px 10px}
  .streak s{width:5px;height:5px;border-radius:50%;background:var(--jade);display:block}

  /* ---------- progresso segmentado ---------- */
  .segs{display:flex;gap:3px;margin-bottom:8px}
  .seg{flex:1;height:3px;border-radius:2px;background:var(--line);transition:background .25s ease}
  .seg.on{background:var(--jade)}
  .segtext{font-size:12px;color:var(--dim);margin-bottom:22px}

  /* ---------- navegação ---------- */
  .nav{display:flex;gap:6px;margin-bottom:20px}
  .nav button{flex:1;padding:11px 0;background:transparent;border:1px solid var(--line);
    border-radius:11px;font-size:13px;color:var(--muted);transition:all .15s ease}
  .nav button:active{transform:scale(.98)}
  .nav button:disabled{opacity:.3}
  .nav button.today{flex:0 0 auto;padding:11px 20px;color:var(--text);
    background:var(--raised);border-color:var(--raised);font-weight:500}

  /* ---------- cards ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:18px;margin-bottom:12px}
  .lbl{font-size:11px;color:var(--dim);letter-spacing:.06em;margin:0 0 14px}

  /* ---------- treino ---------- */
  .wkname{font-family:"Instrument Serif",Georgia,serif;font-size:26px;line-height:1.12;
    letter-spacing:-.01em;margin-bottom:6px}
  .wkcardio{font-size:13px;color:var(--muted);line-height:1.45}
  .wktoggle{margin-top:14px;width:100%;padding:12px;font-size:13px;background:var(--raised);
    border:none;border-radius:11px;color:var(--jade);font-weight:500;transition:transform .12s ease}
  .wktoggle:active{transform:scale(.985)}
  .exlist{margin-top:16px;border-top:1px solid var(--line)}
  .exrow{padding:14px 0;border-bottom:1px solid var(--line)}
  .exrow:last-child{border-bottom:none}
  .extop{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .exname{font-size:14.5px;line-height:1.3}
  .exsets{font-size:13px;color:var(--jade);white-space:nowrap;font-variant-numeric:tabular-nums;
    font-weight:500}
  .exload{display:flex;align-items:center;gap:10px;margin-top:10px}
  .exload input{width:84px;padding:9px 11px;font-size:16px;font-family:inherit;
    border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
  .exload input:focus{outline:none;border-color:var(--jade-dim)}
  .exlast{font-size:12px;color:var(--dim)}
  .exlast b{color:var(--muted);font-weight:500}

  /* ---------- checklist ---------- */
  .item{display:flex;align-items:center;gap:14px;padding:14px 0;
    border-bottom:1px solid var(--line);user-select:none;transition:transform .12s ease}
  .item:last-child{border-bottom:none}
  .item:active{transform:scale(.99)}
  .box{width:23px;height:23px;flex:0 0 23px;border-radius:8px;border:1.5px solid var(--line);
    display:grid;place-items:center;transition:all .18s cubic-bezier(.34,1.4,.64,1)}
  .item.on .box{background:var(--jade);border-color:var(--jade)}
  .box svg{width:13px;height:13px;opacity:0;transform:scale(.5);
    transition:all .18s cubic-bezier(.34,1.4,.64,1)}
  .item.on .box svg{opacity:1;transform:scale(1)}
  .ilabel{font-size:15px;line-height:1.3;transition:color .2s ease}
  .item.on .ilabel{color:var(--dim)}
  .isub{font-size:12.5px;color:var(--dim);margin-top:3px}

  /* ---------- água ---------- */
  .whead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
  .wamt{font-family:"Instrument Serif",Georgia,serif;font-size:22px;
    font-variant-numeric:tabular-nums;letter-spacing:.01em}
  .wamt em{font-style:normal;font-size:13px;color:var(--dim);font-family:Inter,sans-serif}
  .water{display:flex;gap:6px}
  .glass{flex:1;height:54px;border:1px solid var(--line);border-radius:9px;background:var(--bg);
    padding:0;overflow:hidden;display:flex;align-items:flex-end;transition:transform .12s ease}
  .glass:active{transform:scale(.95)}
  .glass i{display:block;width:100%;height:0;background:var(--jade);
    transition:height .28s cubic-bezier(.4,0,.2,1)}
  .glass.on{border-color:var(--jade-dim)}
  .glass.on i{height:100%}

  /* ---------- medidas ---------- */
  .fields{display:flex;gap:10px}
  .fields label{flex:1;font-size:12px;color:var(--dim)}
  .fields input{width:100%;margin-top:7px;padding:13px;font-size:16px;font-family:inherit;
    border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--text)}
  .fields input:focus{outline:none;border-color:var(--jade-dim)}
  .hist{margin-top:16px;border-top:1px solid var(--line)}
  .hist div{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;
    border-bottom:1px solid var(--line);font-size:13.5px}
  .hist div:last-child{border-bottom:none}
  .hist span:first-child{color:var(--dim)}
  .hist b{font-variant-numeric:tabular-nums;font-weight:500}
  .delta{color:var(--jade);font-size:12px;margin-left:6px}

  textarea{width:100%;min-height:76px;padding:13px;font-size:15px;font-family:inherit;
    resize:vertical;border:1px solid var(--line);border-radius:11px;background:var(--bg);
    color:var(--text);line-height:1.5}
  textarea:focus{outline:none;border-color:var(--jade-dim)}
  textarea::placeholder,.fields input::placeholder,.exload input::placeholder{color:var(--dim)}

  /* ---------- grade dos 30 dias ---------- */
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
  .cell{aspect-ratio:1;border-radius:11px;border:1px solid var(--line);background:var(--bg);
    display:grid;place-items:center;font-size:12px;color:var(--dim);
    font-variant-numeric:tabular-nums;transition:transform .12s ease}
  .cell:active{transform:scale(.94)}
  .cell.part{border-color:var(--jade-dim);color:var(--muted)}
  .cell.full{background:var(--jade);border-color:var(--jade);color:#0E1311;font-weight:600}
  .cell.now{box-shadow:0 0 0 2px var(--text)}
  .cell.future{opacity:.35}

  /* ---------- nota de segurança ---------- */
  .note{font-size:12.5px;color:var(--muted);line-height:1.6;padding:16px 18px;
    background:var(--surface);border:1px solid var(--line);border-radius:18px;
    border-left:2px solid var(--jade-dim);margin-bottom:12px}

  /* ---------- ferramentas ---------- */
  .tools{display:flex;gap:8px;margin-bottom:10px}
  .tools button{flex:1;padding:13px;font-size:13px;background:transparent;
    border:1px solid var(--line);border-radius:11px;color:var(--muted);transition:transform .12s ease}
  .tools button:active{transform:scale(.985)}
  .reset{width:100%;padding:13px;font-size:12.5px;background:transparent;border:none;
    color:var(--dim);transition:color .2s ease}
  .reset[data-armed]{color:var(--danger);font-weight:600}

  /* ---------- setup ---------- */
  .setup{padding:64px 4px;text-align:center}
  .setup .mark{font-family:"Instrument Serif",Georgia,serif;font-size:80px;line-height:1;
    color:var(--jade);margin-bottom:6px}
  .setup h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:30px;
    margin:0 0 14px;letter-spacing:-.01em}
  .setup p{color:var(--muted);font-size:14.5px;line-height:1.65;margin:0 auto 32px;max-width:330px}
  .btn{padding:16px 32px;background:var(--jade);color:#0E1311;border:none;border-radius:13px;
    font-size:15.5px;font-weight:600;transition:transform .12s ease}
  .btn:active{transform:scale(.97)}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--raised);
    color:var(--text);padding:13px 20px;border-radius:12px;font-size:13px;z-index:50;
    border:1px solid var(--line);max-width:88%;text-align:center}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"><div class="boot">Carregando seu plano…</div></div>

<script>
(function(){
  const KEY='plano30:v2';
  const root=document.getElementById('root');
  let state={start:null,days:{},logs:{},loads:{}};
  let view=null, showEx=false;

  const TASKS=[
    {id:'treino',label:'Treino do dia',sub:'academia ou corrida, conforme o dia'},
    {id:'caminhada',label:'Caminhada 40 min',sub:'fora do treino, pode fracionar'},
    {id:'creatina',label:'Creatina 5 g',sub:'todo dia, sem exceção'},
    {id:'sono',label:'Dormi 8 horas',sub:'requisito, não meta'}
  ];
  const MEALS=[
    {id:'cafe',label:'Café da manhã',sub:'~350 kcal · 40 g proteína'},
    {id:'almoco',label:'Almoço',sub:'~500 kcal · 55 g proteína'},
    {id:'lanche',label:'Lanche',sub:'~250 kcal · 35 g proteína'},
    {id:'jantar',label:'Jantar',sub:'~450 kcal · 45 g proteína'},
    {id:'ceia',label:'Ceia',sub:'~150 kcal · 25 g proteína'}
  ];
  const WORKOUTS={
    1:{name:'Superiores A',sub:'empurrar',cardio:'20 min esteira, inclinação 10%',load:true,ex:[
      ['Supino reto com halteres','4×8-10'],['Supino inclinado','3×10-12'],
      ['Desenvolvimento com halteres','3×10-12'],['Elevação lateral','3×12-15'],
      ['Tríceps na corda','3×12'],['Tríceps testa','3×12']]},
    2:{name:'Inferiores A',sub:'quadríceps',cardio:'15 min bicicleta',load:true,ex:[
      ['Agachamento livre ou Smith','4×8-10'],['Leg press','3×12'],
      ['Cadeira extensora','3×12-15'],['Mesa flexora','3×12'],['Panturrilha em pé','4×15-20']]},
    3:{name:'Corrida intervalada',sub:'com core',cardio:'5 min aquece · tiros · 5 min desaquece',load:false,ex:[
      ['Tiros — sem. 1 / 2 / 3 / 4','6× / 7× / 8× / 8×'],['Prancha','3×45s'],
      ['Abdominal infra','3×15'],['Prancha lateral','2×30s']]},
    4:{name:'Superiores B',sub:'puxar',cardio:'20 min bike ou esteira',load:true,ex:[
      ['Puxada frontal','4×10'],['Remada baixa','4×10'],
      ['Remada curvada com halteres','3×10-12'],['Crucifixo inverso','3×15'],
      ['Rosca direta','3×10-12'],['Rosca martelo','3×12']]},
    5:{name:'Inferiores B',sub:'posterior e glúteo',cardio:'15 min esteira inclinada',load:true,ex:[
      ['Levantamento terra romeno','4×10'],['Afundo / passada','3×12 cada'],
      ['Cadeira flexora','3×12'],['Elevação pélvica','3×12'],['Abdução de quadril','3×15']]},
    6:{name:'Ombro e braço',sub:'sexto dia',cardio:'25 min esteira, inclinação 8-10%',load:true,ex:[
      ['Desenvolvimento máquina','4×10'],['Elevação lateral','4×12-15'],
      ['Elevação frontal','3×12'],['Crucifixo inverso','3×15'],
      ['Rosca alternada','3×12'],['Tríceps francês','3×12']]},
    0:{name:'Corrida contínua',sub:'sem academia',cardio:'25 a 35 min conforme a semana',load:false,ex:[
      ['Corrida — sem. 1 / 2 / 3 / 4','25 / 30 / 30 / 35 min'],['Alongamento','10 min']]}
  };

  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
  const today=()=>iso(new Date());
  const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
  const dayIndex=s=>Math.round((parse(s)-parse(state.start))/86400000)+1;
  const pretty=s=>parse(s).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'short'});
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function load(){
    try{const raw=localStorage.getItem(KEY);if(raw)state=Object.assign(state,JSON.parse(raw));}
    catch(e){toast('Não deu para ler os dados salvos.');}
  }
  let t=null;
  function save(){
    clearTimeout(t);
    t=setTimeout(()=>{
      try{localStorage.setItem(KEY,JSON.stringify(state));}
      catch(e){toast('Não deu para salvar. Verifique o espaço do navegador.');}
    },200);
  }
  function toast(m){
    const el=document.createElement('div');el.className='toast';el.textContent=m;
    document.body.appendChild(el);setTimeout(()=>el.remove(),2800);
  }
  function buzz(){try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}}

  function day(d){if(!state.days[d])state.days[d]={done:{},water:0,nota:''};
    if(state.days[d].nota===undefined)state.days[d].nota='';return state.days[d];}
  const TOTAL=TASKS.length+MEALS.length+1;
  function doneCount(d){const x=state.days[d];if(!x)return 0;
    return Object.values(x.done).filter(Boolean).length+(x.water>=8?1:0);}
  function score(d){return doneCount(d)/TOTAL;}
  function streak(){let n=0,d=today();if(score(d)<1)d=addDays(d,-1);
    while(score(d)>=1){n++;d=addDays(d,-1);}return n;}
  function lastLoad(name,before){
    const h=state.loads[name];if(!h)return null;
    const prev=Object.keys(h).filter(k=>k<before).sort();
    return prev.length?{kg:h[prev[prev.length-1]],date:prev[prev.length-1]}:null;
  }

  function render(){
    if(!state.start)return renderSetup();
    const idx=dayIndex(view), wk=WORKOUTS[parse(view).getDay()], d=day(view);
    const n=doneCount(view), st=streak(), isToday=view===today();

    root.innerHTML=`
      <div class="hero">
        <div class="dayblock">
          <div class="daynum">${idx>0&&idx<=30?idx:'–'}</div>
          <div class="dayof">de 30</div>
        </div>
        <div class="heroright">
          <div class="datestr">${pretty(view)}</div>
          ${st>0?`<div class="streak"><s></s>${st} ${st===1?'dia seguido':'dias seguidos'}</div>`:''}
        </div>
      </div>

      <div class="segs">${Array.from({length:TOTAL},(_,i)=>
        `<div class="seg ${i<n?'on':''}"></div>`).join('')}</div>
      <div class="segtext">${n} de ${TOTAL} cumpridos hoje</div>

      <div class="nav">
        <button data-go="-1">Ontem</button>
        <button class="today" data-go="0" ${isToday?'disabled':''}>Hoje</button>
        <button data-go="1" ${isToday?'disabled':''}>Amanhã</button>
      </div>

      <div class="card">
        <div class="wkname">${wk.name}<span style="color:var(--dim)"> · ${wk.sub}</span></div>
        <div class="wkcardio">Cardio: ${wk.cardio}</div>
        <button class="wktoggle" data-ex>${showEx?'Esconder exercícios':'Ver exercícios e anotar carga'}</button>
        ${showEx?`<div class="exlist">${wk.ex.map(e=>exRow(e,wk.load)).join('')}</div>`:''}
      </div>

      <div class="card"><p class="lbl">Execução do dia</p>${TASKS.map(x=>item(x,d)).join('')}</div>
      <div class="card"><p class="lbl">Refeições · 1.700 kcal · 200 g de proteína</p>${MEALS.map(x=>item(x,d)).join('')}</div>

      <div class="card">
        <div class="whead">
          <p class="lbl" style="margin:0">Água</p>
          <div class="wamt">${(d.water*0.5).toFixed(1).replace('.',',')} L <em>de 4 L</em></div>
        </div>
        <div class="water">${Array.from({length:8},(_,i)=>
          `<button class="glass ${i<d.water?'on':''}" data-water="${i+1}"><i></i></button>`).join('')}</div>
      </div>

      <div class="card">
        <p class="lbl">Medidas da semana</p>
        <div class="fields">
          <label>Peso (kg)<input type="number" step="0.1" inputmode="decimal" data-log="peso"
            value="${state.logs[view]&&state.logs[view].peso!=null?state.logs[view].peso:''}" placeholder="93,0"></label>
          <label>Cintura (cm)<input type="number" step="0.5" inputmode="decimal" data-log="cintura"
            value="${state.logs[view]&&state.logs[view].cintura!=null?state.logs[view].cintura:''}" placeholder="104"></label>
        </div>
        ${history()}
      </div>

      <div class="card"><p class="lbl">Como foi o dia</p>
        <textarea data-nota placeholder="Energia, fome, sono, carga que travou…">${esc(d.nota)}</textarea>
      </div>

      <div class="card"><p class="lbl">Os 30 dias</p>
        <div class="grid">${Array.from({length:30},(_,i)=>{
          const dt=addDays(state.start,i), s=score(dt);
          const cls=s>=1?'full':s>0?'part':(dt>today()?'future':'');
          return `<button class="cell ${cls} ${dt===view?'now':''}" data-day="${dt}">${i+1}</button>`;
        }).join('')}</div>
      </div>

      <div class="note">
        Se dois destes durarem mais de 3 dias — carga caindo, tontura, sono quebrando, irritação,
        fome que não passa — suba para 2.000 kcal. É leitura de instrumento, não desistência.
        Se um dia furar, retome no seguinte: sem jejum e sem treino dobrado para compensar.
      </div>

      <div class="tools">
        <button data-export>Salvar backup</button>
        <button data-import>Restaurar backup</button>
      </div>
      <button class="reset" data-reset>Recomeçar o desafio do zero</button>`;
    wire();
  }

  function exRow(e,hasLoad){
    const [name,sets]=e;
    const cur=(state.loads[name]&&state.loads[name][view])!=null?state.loads[name][view]:'';
    const prev=lastLoad(name,view);
    return `<div class="exrow">
      <div class="extop"><div class="exname">${esc(name)}</div><div class="exsets">${sets}</div></div>
      ${hasLoad?`<div class="exload">
        <input type="number" step="0.5" inputmode="decimal" placeholder="kg"
          data-loadex="${esc(name)}" value="${cur}">
        <div class="exlast">${prev?`última: <b>${prev.kg} kg</b> · dia ${dayIndex(prev.date)}`:'primeira vez'}</div>
      </div>`:''}
    </div>`;
  }

  function item(x,d){
    const on=!!d.done[x.id];
    return `<div class="item ${on?'on':''}" data-task="${x.id}">
      <div class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#0E1311" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div><div class="ilabel">${x.label}</div><div class="isub">${x.sub}</div></div></div>`;
  }

  function history(){
    const keys=Object.keys(state.logs).filter(k=>state.logs[k].peso!=null).sort();
    if(!keys.length)return '';
    const first=state.logs[keys[0]].peso;
    return `<div class="hist">${keys.slice(-6).map(k=>{
      const p=state.logs[k].peso, dif=p-first, c=state.logs[k].cintura;
      return `<div><span>Dia ${dayIndex(k)}</span><span><b>${p} kg</b>${c?' · '+c+' cm':''}${
        keys[0]!==k?`<span class="delta">${dif>0?'+':''}${dif.toFixed(1)}</span>`:''}</span></div>`;
    }).join('')}</div>`;
  }

  function renderSetup(){
    root.innerHTML=`<div class="setup">
      <div class="mark">30</div>
      <h1>Trinta dias, sem furar</h1>
      <p>1.700 kcal, 200 g de proteína, seis dias de academia e 40 minutos de caminhada por dia.
      Marque o que você cumpriu — fica salvo neste aparelho e continua de onde você parou.</p>
      <button class="btn" data-start>Começar hoje</button></div>`;
    root.querySelector('[data-start]').onclick=()=>{state.start=today();view=today();save();render();};
  }

  function wire(){
    root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
      const n=+b.dataset.go; view=n===0?today():addDays(view,n); showEx=false; render();});
    root.querySelector('[data-ex]').onclick=()=>{showEx=!showEx;render();};
    root.querySelectorAll('[data-task]').forEach(el=>el.onclick=()=>{
      const d=day(view),id=el.dataset.task; d.done[id]=!d.done[id]; buzz(); save(); render();});
    root.querySelectorAll('[data-water]').forEach(el=>el.onclick=()=>{
      const d=day(view),n=+el.dataset.water; d.water=(d.water===n)?n-1:n; buzz(); save(); render();});
    root.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{
      view=el.dataset.day; showEx=false; render(); window.scrollTo({top:0,behavior:'smooth'});});
    root.querySelectorAll('[data-log]').forEach(el=>el.onchange=()=>{
      if(!state.logs[view])state.logs[view]={};
      state.logs[view][el.dataset.log]=el.value===''?null:parseFloat(el.value);
      save(); render();});
    root.querySelectorAll('[data-loadex]').forEach(el=>el.onchange=()=>{
      const n=el.dataset.loadex;
      if(!state.loads[n])state.loads[n]={};
      if(el.value==='')delete state.loads[n][view];
      else state.loads[n][view]=parseFloat(el.value);
      save(); render();});
    const nota=root.querySelector('[data-nota]');
    if(nota)nota.oninput=()=>{day(view).nota=nota.value;save();};
    root.querySelector('[data-export]').onclick=exportar;
    root.querySelector('[data-import]').onclick=importar;
    const rst=root.querySelector('[data-reset]');
    if(rst)rst.onclick=()=>{
      if(rst.dataset.armed){
        state={start:null,days:{},logs:{},loads:{}};
        try{localStorage.removeItem(KEY);}catch(e){}
        view=today(); render(); toast('Desafio zerado. Comece quando quiser.');
      }else{
        rst.dataset.armed='1';
        rst.textContent='Apagar tudo e recomeçar? Toque de novo';
        setTimeout(()=>{if(rst.dataset.armed){delete rst.dataset.armed;
          rst.textContent='Recomeçar o desafio do zero';}},5000);
      }
    };
  }

  function exportar(){
    const blob=new Blob([JSON.stringify(state)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='plano30-backup-'+today()+'.json';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast('Backup salvo nos seus downloads.');
  }
  function importar(){
    const inp=document.createElement('input');
    inp.type='file'; inp.accept='application/json,.json';
    inp.onchange=()=>{
      const f=inp.files[0]; if(!f)return;
      const r=new FileReader();
      r.onload=()=>{
        try{
          const obj=JSON.parse(r.result);
          if(!obj.start)throw new Error('formato');
          state=Object.assign({start:null,days:{},logs:{},loads:{}},obj);
          save(); view=today(); render(); toast('Backup restaurado.');
        }catch(e){toast('Arquivo inválido. Escolha um backup deste app.');}
      };
      r.readAsText(f);
    };
    inp.click();
  }

  load(); view=today(); render();
})();
</script>
</body>
</html>
